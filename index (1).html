<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radios Mendoza</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#081120;
    color:white;
    font-family:Segoe UI,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.radio-cards{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.radio-card{
    flex:1;
    min-width:110px;
    background:#0f1a2f;
    border-radius:16px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.radio-card:hover{
    background:#17284a;
    transform:translateY(-4px);
}

.icon{
    font-size:36px;
    margin-bottom:10px;
}

.max{
    font-size:22px;
    font-weight:bold;
    color:#38bdf8;
}

.min{
    color:#b6c1d2;
    margin-top:5px;
}

.player{
    margin-top:30px;
    background:#11203a;
    padding:20px;
    border-radius:20px;
}

#actual{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
    text-align:center;
}

audio{
    width:100%;
}

.radio-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:12px;
}

@media (max-width:768px){

    .radio-cards{
        grid-template-columns:repeat(2,1fr);
    }

    .radio-card{
        min-width:auto;
    }

}

</style>
</head>
<body>

<h1>📻 Morro Sound  </h1>

<div class="radio-cards">

<div class="radio-card"
onclick="reproducir('https://st1-mpanel-icy.masterhost.com.ar:8100/radio.mp3')">
<div class="icon">☀️</div>
<div class="max">SOL</div>
<div class="min">Estación</div>
</div>

<div class="radio-card"
onclick="reproducir('https://playerservices.streamtheworld.com/api/livestream-redirect/BRAVA_FM949.mp3','Brava')">

    <div class="icon">🔥</div>
    <div class="max">BRAVA</div>
    <div class="min">FM 94.9</div>

</div>


<div class="radio-card"
onclick="reproducir('https://26483.live.streamtheworld.com/LA_RED_MDZ_FM941.mp3')">
<div class="icon">🎙️</div>
<div class="max">LA RED</div>
<div class="min">Mendoza</div>
</div>

<div class="radio-card"
onclick="reproducir('https://27323.live.streamtheworld.com/NIHUIL_AM680.mp3')">

    <div class="icon">🔥</div>
    <div class="max">NIHUIL</div>
    <div class="min">am 680</div>

</div>

<div class="radio-card"
onclick="reproducir('https://radios.solumedia.com:6560/stream')">
<div class="icon">🎵</div>
<div class="max">Vorterix</div>
<div class="min">FM</div>
</div>

<div class="radio-card"
onclick="reproducir('
https://27413.live.streamtheworld.com/FM999_56AAC.aac?dist=la100_other_app_webplayer&tdsdk=js-2.9&swm=false&pname=TDSdk&pversion=2.9&banners=none&burst-time=15&sbmid=a3165573-1e0e-4003-dcea-fdf438894e7')">
    <div class="icon">🎵</div>
    <div class="max">LA 100</div>
    <div class="min">Buenos Aires</div>
</div>

<div class="radio-card"
onclick="reproducir('https://26563.live.streamtheworld.com/DISNEY_ARG_BA.mp3?dist=web-radiodisney&bundle-id=com.disney.radiodisneybrazil_goo')">
    <div class="icon">🏰</div>
    <div class="max">DISNEY</div>
    <div class="min">FM</div>
</div>

<div class="radio-card"
onclick="reproducir('https://frontend.radiohdvivo.com/los40/live?dist=los40-web-live_streaming_play')">
    <div class="icon">🎤</div>
    <div class="max">LOS 40</div>
    <div class="min">Hits</div>
</div>

<div class="radio-card"
onclick="reproducir('URL_METRO','Metro')">
    <div class="icon">🎧</div>
    <div class="max">METRO</div>
    <div class="min">95.1</div>
</div>

<div class="radio-card"
onclick="reproducir('https://masservidor.net:7176/stream')">
    <div class="icon">🎸</div>
    <div class="max">Metropolitana </div>
    <div class="min">95.3</div>
</div>

</div>

<div class="player">

<div id="actual">
Seleccioná una radio
</div>

<audio id="player" controls></audio>

</div>

<script>

function reproducir(url,nombre){

    document.getElementById("actual").innerText =
    "🎵 Reproduciendo: " + nombre;

    const player =
    document.getElementById("player");

    player.src = url;
    player.play();
}

</script>

</body>
</html>
